<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: High-Contrast Indigo to Iris -->
    <linearGradient id="favBg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- Vibrant Amber / Golden Sunset Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Clean Crisp Paper Gradient -->
    <linearGradient id="favPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- App Tile Squircle (Maximized for browser tab visibility) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#favBg)"/>

  <!-- Top Sheen Highlight -->
  <path d="M 2 17 C 2 8.7 8.7 2 17 2 H 47 C 55.3 2 62 8.7 62 17 C 62 23 48 30 32 30 C 16 30 2 23 2 17 Z" 
        fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Inset Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Note Paper Sheet with Folded Dog-Ear Corner -->
  <path d="
    M 19 12 
    H 36 
    L 48 24 
    V 50 
    C 48 52.2 46.2 54 44 54 
    H 19 
    C 16.8 54 15 52.2 15 50 
    V 16 
    C 15 13.8 16.8 12 19 12 
    Z" 
    fill="url(#favPage)"/>

  <!-- Paper Fold Under-Shadow -->
  <path d="M 36 12 L 36 22 C 36 23.1 36.9 24 38 24 L 48 24 Z" 
        fill="#0F172A" fill-opacity="0.16"/>

  <!-- Folded Dog-Ear Corner Flap (Golden Accent) -->
  <path d="
    M 36 12 
    L 48 24 
    H 38.5 
    C 37.1 24 36 22.9 36 21.5 
    Z" 
    fill="url(#favGold)"/>

  <!-- Fold Specular Highlight -->
  <path d="M 36 12 L 48 24" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" stroke-linecap="round"/>

  <!-- Note Lines (Bold & Crisp for small scale) -->
  <!-- Title Line: Indigo Accent -->
  <rect x="20" y="20" width="12" height="3.5" rx="1.75" fill="#4F46E5"/>
  
  <!-- Content Line 1 -->
  <rect x="20" y="27.5" width="22" height="3" rx="1.5" fill="#94A3B8"/>

  <!-- Content Line 2 -->
  <rect x="20" y="34.5" width="18" height="3" rx="1.5" fill="#CBD5E1"/>

  <!-- Content Line 3 with Amber Bullet -->
  <circle cx="21.5" cy="42" r="1.75" fill="#F59E0B"/>
  <rect x="25.5" y="40.5" width="10" height="3" rx="1.5" fill="#CBD5E1"/>

  <!-- Radiant Golden Idea Spark (Signoff mark) -->
  <!-- 4-point star at bottom-right corner -->
  <path d="
    M 47 37 
    Q 47 43 41 43 
    Q 47 43 47 49 
    Q 47 43 53 43 
    Q 47 43 47 37 
    Z" 
    fill="url(#favGold)"/>
  
  <!-- Glowing Center Core Dot -->
  <circle cx="47" cy="43" r="1.1" fill="#FFFFFF"/>
</svg>