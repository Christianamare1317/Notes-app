<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafc">
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container" class="app-container">
    <!-- Brand / Header Section -->
    <header class="app-header">
      <div class="logo-mark">
        <!-- SVG Note Icon -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <h1>Notes App</h1>
      <p class="subtitle">Simple, lively note-taking</p>
    </header>

    <!-- Global Feedback Banner (Error & Success Messages) -->
    <div id="message-banner" class="message-banner hidden" role="alert" aria-live="assertive"></div>

    <!-- VIEW 1: AUTHENTICATION CONTAINER (Shown when NOT logged in) -->
    <main id="auth-view" class="card">
      <!-- Tab Navigation to switch between Sign In and Sign Up -->
      <nav class="auth-tabs" role="tablist">
        <button id="tab-login" class="tab-btn active" role="tab" aria-selected="true" type="button">
          Log In
        </button>
        <button id="tab-signup" class="tab-btn" role="tab" aria-selected="false" type="button">
          Sign Up
        </button>
      </nav>

      <!-- Log In Form -->
      <form id="login-form" class="auth-form" autocomplete="on">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input 
            type="password" 
            id="login-password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary">
          Log In
        </button>

        <p class="form-footer">
          Don't have an account? 
          <a href="#" id="switch-to-signup" class="link">Sign up</a>
        </p>
      </form>

      <!-- Sign Up Form (hidden by default) -->
      <form id="signup-form" class="auth-form hidden" autocomplete="on">
        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input 
            type="email" 
            id="signup-email" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <input 
            type="password" 
            id="signup-password" 
            placeholder="At least 6 characters" 
            minlength="6" 
            required 
            autocomplete="new-password"
          >
          <small class="field-hint">Must be at least 6 characters long</small>
        </div>

        <button type="submit" id="signup-submit-btn" class="btn btn-primary">
          Create Account
        </button>

        <p class="form-footer">
          Already have an account? 
          <a href="#" id="switch-to-login" class="link">Log in</a>
        </p>
      </form>

      <!-- Social Auth Divider -->
      <div class="auth-divider" role="separator" aria-label="or">
        <span>or</span>
      </div>

      <!-- Continue with Google Button -->
      <button type="button" id="google-login-btn" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span id="google-btn-text">Continue with Google</span>
      </button>
    </main>

    <!-- VIEW 2: LOGGED-IN DASHBOARD VIEW (Shown when user IS logged in) -->
    <main id="dashboard-view" class="dashboard-view hidden">
      <!-- User Profile Header Bar -->
      <section class="card user-profile-bar">
        <div class="user-info">
          <div class="user-avatar-sm">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <p class="user-status-text">
            Logged in as <strong id="logged-in-user-email">user@example.com</strong>
          </p>
        </div>
        <button id="logout-btn" class="btn btn-secondary btn-logout" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Log Out
        </button>
      </section>

      <!-- 1. Form to add a note (title and content) -->
      <section class="card note-form-card">
        <h2 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add a Note
        </h2>
        <form id="add-note-form" class="note-form">
          <div class="form-group">
            <label for="note-title-input">Title <span class="required-asterisk">*</span></label>
            <input 
              type="text" 
              id="note-title-input" 
              placeholder="e.g. Project Ideas, Grocery List..." 
              required
            >
          </div>

          <div class="form-group">
            <label for="note-content-input">Content</label>
            <textarea 
              id="note-content-input" 
              placeholder="Write your note here..." 
              rows="3"
            ></textarea>
          </div>

          <button type="submit" id="add-note-submit-btn" class="btn btn-primary">
            Add Note
          </button>
        </form>
      </section>

      <!-- 2. Notes List Section -->
      <section class="notes-section">
        <div class="notes-section-header">
          <h2 class="section-title">My Notes</h2>
          <span id="notes-count-badge" class="badge">0</span>
        </div>

        <!-- Loading State Indicator -->
        <div id="notes-loading" class="card state-card">
          <div class="spinner"></div>
          <p>Loading your notes...</p>
        </div>

        <!-- Empty State Indicator ("No notes yet") -->
        <div id="notes-empty" class="card state-card hidden">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <p class="state-title">No notes yet</p>
          <p class="state-subtitle">Use the form above to write your first note!</p>
        </div>

        <!-- Dynamic Notes List Container (Rendered via textContent) -->
        <div id="notes-list" class="notes-list"></div>
      </section>
    </main>
  </div>

  <!-- Load Supabase JS client from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Load Project Configuration -->
  <script src="config.js"></script>

  <!-- Load Application Logic -->
  <script src="app.js"></script>
</body>
</html>
